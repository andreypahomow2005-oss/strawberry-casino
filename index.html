<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клубничка Казино</title>
    <style>
        :root {
            --bg-color: #0b0205;
            --panel-bg: rgba(30, 8, 22, 0.9);
            --neon-pink: #ff1493;
            --neon-red: #ff073a;
            --strawberry: #ff2a6d;
            --gold: #ffd700;
            --neon-cyan: #00f0ff;
            --neon-lime: #39ff14;
            --neon-purple: #9d00ff;
            --text-color: #fff;
            --border-glow: 0 0 20px rgba(255, 20, 147, 0.7), 0 0 40px rgba(255, 42, 109, 0.4);
        }

        body {
            background: radial-gradient(circle at center, #360222 0%, #1a010d 50%, var(--bg-color) 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 {
            color: var(--gold);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 2.2rem;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-red), 0 0 30px var(--gold), 0 0 40px var(--neon-cyan);
            margin-bottom: 25px;
            animation: glowPulse 3s infinite alternate;
        }

        @keyframes glowPulse {
            0% {
                text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-red), 0 0 30px var(--gold);
            }
            100% {
                text-shadow: 0 0 15px var(--neon-cyan), 0 0 25px var(--neon-pink), 0 0 35px var(--gold), 0 0 50px var(--neon-lime);
            }
        }

        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--panel-bg);
            border: 3px solid;
            border-image: linear-gradient(45deg, var(--neon-pink), var(--gold), var(--neon-cyan), var(--neon-lime)) 1;
            border-radius: 16px;
            box-shadow: var(--border-glow);
            padding: 30px;
            box-sizing: border-box;
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 2;
        }

        .setup-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .player-input {
            background: rgba(15, 3, 12, 0.95);
            border: 2px solid var(--strawberry);
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 0 8px rgba(255, 42, 109, 0.3);
        }

        .player-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan), inset 0 0 8px var(--neon-cyan);
        }

        .btn {
            background: linear-gradient(135deg, var(--neon-red), var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px var(--neon-pink), 0 0 25px var(--neon-red);
            transition: all 0.2s;
        }

        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px var(--gold), 0 0 35px var(--neon-cyan);
            background: linear-gradient(135deg, var(--gold), var(--neon-pink), var(--neon-cyan));
            color: #0b0205;
        }

        .tournament-bracket {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px;
        }

        .round-column {
            flex: 1;
            min-width: 230px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 15px;
        }

        .round-title {
            text-align: center;
            color: var(--gold);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-size: 1rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--gold);
        }

        .match-card {
            background: rgba(18, 4, 15, 0.95);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            box-shadow: inset 0 0 12px rgba(255, 20, 147, 0.2), 0 0 10px rgba(0, 240, 255, 0.2);
            transition: all 0.3s;
        }

        .match-card:hover {
            border-color: var(--neon-pink);
            box-shadow: inset 0 0 15px rgba(255, 20, 147, 0.4), 0 0 15px var(--neon-pink);
        }

        .slot {
            background: rgba(35, 10, 25, 0.9);
            border: 2px dashed var(--strawberry);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .slot:hover:not(.empty):not(.winner-slot) {
            border-color: var(--neon-cyan);
            background: rgba(10, 40, 50, 0.9);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .slot.winner {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.3), rgba(57, 255, 20, 0.3));
            border: 2px solid var(--gold);
            color: var(--gold);
            font-weight: bold;
            box-shadow: 0 0 15px var(--gold), 0 0 25px rgba(57, 255, 20, 0.4);
            text-shadow: 0 0 8px var(--gold);
        }

        .slot.empty {
            color: rgba(255, 255, 255, 0.3);
            cursor: default;
            font-style: italic;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .winner-banner {
            text-align: center;
            margin-top: 25px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 7, 58, 0.35), rgba(0, 240, 255, 0.25));
            border: 3px solid var(--gold);
            border-radius: 14px;
            box-shadow: 0 0 30px var(--gold), 0 0 50px var(--neon-pink);
            display: none;
            animation: winnerGlow 2s infinite alternate;
        }

        @keyframes winnerGlow {
            0% {
                box-shadow: 0 0 20px var(--gold), 0 0 40px var(--neon-pink);
            }
            100% {
                box-shadow: 0 0 35px var(--gold), 0 0 60px var(--neon-cyan), 0 0 20px var(--neon-lime);
            }
        }

        .winner-banner h2 {
            color: var(--gold);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--gold), 0 0 25px var(--neon-red);
            font-size: 1.8rem;
        }

        .winner-banner span {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-pink), 0 0 30px var(--neon-cyan);
        }

        /* Конфетти и хлопушки */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
            display: none;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--gold);
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1>🍓 Клубничка Казино 🍓</h1>

    <div class="container">
        <div class="setup-section" id="setupSection">
            <h3 style="margin: 0; color: var(--gold); text-shadow: 0 0 8px var(--gold);">Введите участников (до 8 человек):</h3>
            <div class="inputs-grid" id="inputsGrid">
                <!-- Динамические поля ввода -->
            </div>
            <button class="btn" onclick="startTournament()">Запустить 🎰</button>
        </div>

        <div class="tournament-bracket" id="bracketContainer" style="display: none;">
            <!-- Сетка турнира рендерится через JS -->
        </div>

        <div class="winner-banner" id="winnerBanner">
            <h2>🍓 Клубничный Победитель 🍓</h2>
            <span id="winnerName">Имя победителя</span>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        const MAX_PLAYERS = 8;
        let tournamentData = {
            round1: [
                { p1: '', p2: '', winner: null },
                { p1: '', p2: '', winner: null },
                { p1: '', p2: '', winner: null },
                { p1: '', p2: '', winner: null }
            ],
            round2: [
                { p1: '', p2: '', winner: null },
                { p1: '', p2: '', winner: null }
            ],
            round3: [
                { p1: '', p2: '', winner: null }
            ]
        };

        const inputsGrid = document.getElementById('inputsGrid');
        for (let i = 1; i <= MAX_PLAYERS; i++) {
            inputsGrid.innerHTML += `<input type="text" class="player-input" placeholder="Участник ${i}" value="Игрок ${i}">`;
        }

        function startTournament() {
            const inputElements = document.querySelectorAll('.player-input');
            let players = [];
            inputElements.forEach(input => {
                let val = input.value.trim();
                if (val) players.push(val);
            });

            if (players.length < 4) {
                alert('Минимум нужно 4 участника!');
                return;
            }

            while(players.length < 8) {
                players.push('— Свободно —');
            }

            for (let i = 0; i < 4; i++) {
                tournamentData.round1[i].p1 = players[i * 2];
                tournamentData.round1[i].p2 = players[i * 2 + 1];
                tournamentData.round1[i].winner = null;
            }

            tournamentData.round2 = [{ p1: '', p2: '', winner: null }, { p1: '', p2: '', winner: null }];
            tournamentData.round3 = [{ p1: '', p2: '', winner: null }];

            document.getElementById('setupSection').style.display = 'none';
            document.getElementById('bracketContainer').style.display = 'flex';
            document.getElementById('winnerBanner').style.display = 'none';
            document.getElementById('confettiContainer').style.display = 'none';

            renderBracket();
        }

        function renderBracket() {
            const container = document.getElementById('bracketContainer');
            container.innerHTML = `
                <div class="round-column">
                    <div class="round-title">1/4 Финала</div>
                    ${tournamentData.round1.map((m, idx) => createMatchHTML('round1', idx, m)).join('')}
                </div>
                <div class="round-column">
                    <div class="round-title">Полуфинал</div>
                    ${tournamentData.round2.map((m, idx) => createMatchHTML('round2', idx, m)).join('')}
                </div>
                <div class="round-column">
                    <div class="round-title">Финал 🍓</div>
                    ${tournamentData.round3.map((m, idx) => createMatchHTML('round3', idx, m)).join('')}
                </div>
            `;
        }

        function createMatchHTML(round, index, match) {
            const p1Class = match.winner === match.p1 ? 'slot winner' : (match.p1 ? 'slot' : 'slot empty');
            const p2Class = match.winner === match.p2 ? 'slot winner' : (match.p2 ? 'slot' : 'slot empty');

            return `
                <div class="match-card">
                    <div class="${p1Class}" onclick="selectWinner('${round}', ${index}, '${match.p1}')">
                        <span>${match.p1 || 'Ожидание'}</span>
                        ${match.winner === match.p1 ? '👑' : ''}
                    </div>
                    <div class="${p2Class}" onclick="selectWinner('${round}', ${index}, '${match.p2}')">
                        <span>${match.p2 || 'Ожидание'}</span>
                        ${match.winner === match.p2 ? '👑' : ''}
                    </div>
                </div>
            `;
        }

        function selectWinner(round, matchIndex, playerName) {
            if (!playerName || playerName === '— Свободно —' || playerName === 'Ожидание') return;

            tournamentData[round][matchIndex].winner = playerName;

            if (round === 'round1') {
                let nextMatchIdx = Math.floor(matchIndex / 2);
                let slotPosition = matchIndex % 2 === 0 ? 'p1' : 'p2';
                tournamentData.round2[nextMatchIdx][slotPosition] = playerName;
                tournamentData.round2[nextMatchIdx].winner = null;
                tournamentData.round3[0].p1 = '';
                tournamentData.round3[0].p2 = '';
                tournamentData.round3[0].winner = null;
                document.getElementById('winnerBanner').style.display = 'none';
                document.getElementById('confettiContainer').style.display = 'none';
            } else if (round === 'round2') {
                let nextMatchIdx = Math.floor(matchIndex / 2);
                let slotPosition = matchIndex % 2 === 0 ? 'p1' : 'p2';
                tournamentData.round3[nextMatchIdx][slotPosition] = playerName;
                tournamentData.round3[nextMatchIdx].winner = null;
                document.getElementById('winnerBanner').style.display = 'none';
                document.getElementById('confettiContainer').style.display = 'none';
            } else if (round === 'round3') {
                document.getElementById('winnerName').innerText = playerName;
                document.getElementById('winnerBanner').style.display = 'block';
                triggerConfetti();
            }

            renderBracket();
        }

        function triggerConfetti() {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            container.style.display = 'block';

            const colors = ['#ff1493', '#ffd700', '#ff2a6d', '#00f0ff', '#39ff14', '#ff073a'];

            for (let i = 0; i < 70; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 10 + 8) + 'px';
                confetti.style.height = (Math.random() * 10 + 8) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 1.5) + 's';
                container.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
